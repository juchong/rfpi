# =============================================================================
# rf-pi: ADS-B feeder stack + BME680 environmental sensor + log shipping
# =============================================================================
# Conventions for this file
# - Health: the upstream sdr-enthusiasts / plane-watch images ship their own
#   HEALTHCHECKs (readsb data freshness, s6 service death tallies, established
#   TCP sessions to the aggregator). Do not add a `test:` override here: a
#   pgrep-style test matches the s6 supervisor and keeps a feeder stuck in an
#   auth/restart loop "healthy". Only images without a built-in check (bme680,
#   promtail) define a test below.
# - Logging: the daemon default applies to every service (`local` driver,
#   50m x 3 files, /etc/docker/daemon.json); no per-service logging blocks.
# - Limits: pids_limit guards against fork storms. Memory limits are deferred
#   until the memory cgroup is enabled on the host (cgroup_disable=memory is
#   on the kernel cmdline until the next reboot).
# - Airband: the VHF ATC scanner is no longer in Docker. It runs on the host
#   as airband-feeds.service from /home/pi/pluto-airband (Pluto+ receiver).
# - Ports bind 0.0.0.0 (LAN-only host); see README "Follow-ups".

services:

  # ===========================================================================
  # CORE DECODER
  # ===========================================================================

  # Ultrafeeder: readsb (RTL-SDR), tar1090 map, graphs1090, MLAT hub, and the
  # direct aggregator feeds.
  # Web UI: http://<host>:8080 | Graphs: http://<host>:8080/graphs1090
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
    container_name: ultrafeeder
    hostname: ultrafeeder
    restart: unless-stopped
    tty: true
    pids_limit: 256   # ~86 tasks live (readsb x2, 9 mlat-clients, collectd, nginx, s6)
    # RTL-SDR via libusb: the only device readsb opens is /dev/bus/usb/<bus>/<dev>
    # (USB char devices, major 189). The cgroup rule allows them, the bind mount
    # makes them (and re-enumerated nodes after a replug) visible.
    device_cgroup_rules:
      - 'c 189:* rwm'
    ports:
      - 8080:80               # tar1090 web interface
      - 9273-9274:9273-9274   # Prometheus metrics
    environment:
      # General
      - LOGLEVEL=error
      - TZ=${FEEDER_TZ}
      # SDR
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_RTLSDR_DEVICE=${ADSB_SDR_SERIAL}
      - READSB_RTLSDR_PPM=${ADSB_SDR_PPM}
      # Decoder
      - READSB_LAT=${FEEDER_LAT}
      - READSB_LON=${FEEDER_LONG}
      - READSB_ALT=${FEEDER_ALT_M}m
      - READSB_GAIN=${ADSB_SDR_GAIN}
      - READSB_RX_LOCATION_ACCURACY=2
      - READSB_STATS_RANGE=true
      # Aggregator feeds (ADS-B + MLAT)
      - ULTRAFEEDER_CONFIG=
          adsb,feed.adsb.fi,30004,beast_reduce_plus_out;
          adsb,in.adsb.lol,30004,beast_reduce_plus_out;
          adsb,feed.airplanes.live,30004,beast_reduce_plus_out;
          adsb,feed.planespotters.net,30004,beast_reduce_plus_out;
          adsb,feed.theairtraffic.com,30004,beast_reduce_plus_out;
          adsb,data.avdelphi.com,24999,beast_reduce_plus_out;
          adsb,skyfeed.hpradar.com,30004,beast_reduce_plus_out;
          adsb,feed.radarplane.com,30001,beast_reduce_plus_out;
          adsb,dati.flyitalyadsb.com,4905,beast_reduce_plus_out;
          adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out;
          mlat,feed.adsb.fi,31090,39000;
          mlat,in.adsb.lol,31090,39001;
          mlat,feed.airplanes.live,31090,39002;
          mlat,mlat.planespotters.net,31090,39003;
          mlat,feed.theairtraffic.com,31090,39004;
          mlat,skyfeed.hpradar.com,31090,39005;
          mlat,feed.radarplane.com,31090,39006;
          mlat,dati.flyitalyadsb.com,30100,39007;
          mlat,feed.adsbexchange.com,31090,39008;
          mlathub,piaware,30105,beast_in;
          mlathub,rbfeeder,30105,beast_in;
          mlathub,planewatch,30105,beast_in;
      # Identity
      - UUID=${ULTRAFEEDER_UUID}
      - MLAT_USER=${FEEDER_NAME}
      - READSB_FORWARD_MLAT_SBS=true
      # tar1090 map settings
      - UPDATE_TAR1090=true
      - TAR1090_DEFAULTCENTERLAT=${FEEDER_LAT}
      - TAR1090_DEFAULTCENTERLON=${FEEDER_LONG}
      - TAR1090_MESSAGERATEINTITLE=true
      - TAR1090_PAGETITLE=${FEEDER_NAME}
      - TAR1090_PLANECOUNTINTITLE=true
      - TAR1090_ENABLE_AC_DB=true
      - TAR1090_FLIGHTAWARELINKS=true
      - TAR1090_SITESHOW=true
      - TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE=true
      - TAR1090_RANGE_OUTLINE_WIDTH=2.0
      - TAR1090_RANGERINGSDISTANCES=50,100,150,200
      - TAR1090_RANGERINGSCOLORS='#1A237E','#0D47A1','#42A5F5','#64B5F6'
      - TAR1090_USEROUTEAPI=true
      - HEYWHATSTHAT_PANORAMA_ID=${FEEDER_HEYWHATSTHAT_ID}
      - HEYWHATSTHAT_ALTS=${FEEDER_HEYWHATSTHAT_ALTS}
      # graphs1090 settings
      - GRAPHS1090_DARKMODE=true
    volumes:
      # Persistent state on the host. Back up /opt/adsb/ultrafeeder if the
      # globe history / graph history matters; both regenerate otherwise.
      - /opt/adsb/ultrafeeder/globe_history:/var/globe_history
      - /opt/adsb/ultrafeeder/graphs1090:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
      - /dev/bus/usb:/dev/bus/usb
    # The image's own test (/healthcheck.sh: readsb aircraft.json updated in the
    # last 60 s + nginx/readsb/tar1090 s6 death tallies) is inherited; only the
    # cadence is tightened from upstream's 600 s. The feeders below gate on
    # `service_healthy`, and a 600 s first probe would hold every feeder back
    # for 10 minutes on a cold start.
    healthcheck:
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # ===========================================================================
  # FEEDERS (all take Beast/SBS data from ultrafeeder; built-in HEALTHCHECKs)
  # ===========================================================================

  # FlightAware (piaware)
  # Web UI: http://<host>:8081
  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest
    container_name: piaware
    restart: unless-stopped
    tty: true
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    ports:
      - 8081:8080
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - FEEDER_ID=${PIAWARE_FEEDER_ID}

  # FlightRadar24
  # Web UI: http://<host>:8754
  fr24:
    image: ghcr.io/sdr-enthusiasts/docker-flightradar24:latest
    container_name: fr24
    restart: unless-stopped
    tty: true
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    ports:
      - 8754:8754
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - FR24KEY=${FR24_SHARING_KEY}

  # PlaneFinder
  # Web UI: http://<host>:30053
  pfclient:
    image: ghcr.io/sdr-enthusiasts/docker-planefinder:latest
    container_name: pfclient
    restart: unless-stopped
    tty: true
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    ports:
      - 30053:30053
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - SHARECODE=${PLANEFINDER_SHARECODE}

  # AirNav RadarBox
  rbfeeder:
    image: ghcr.io/sdr-enthusiasts/docker-airnavradar:latest
    container_name: rbfeeder
    restart: unless-stopped
    tty: true
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}
      - SHARING_KEY=${AIRNAVRADAR_SHARING_KEY}

  # Plane.watch
  planewatch:
    image: ghcr.io/plane-watch/docker-plane-watch:latest
    container_name: planewatch
    restart: unless-stopped
    tty: true
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}m
      - API_KEY=${PW_API_KEY}

  # ADSBHub
  adsbhub:
    image: ghcr.io/sdr-enthusiasts/docker-adsbhub:latest
    container_name: adsbhub
    restart: unless-stopped
    tty: true
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    environment:
      - TZ=${FEEDER_TZ}
      - SBSHOST=ultrafeeder
      - CLIENTKEY=${ADSBHUB_STATION_KEY}

  # OpenSky Network
  opensky:
    image: ghcr.io/sdr-enthusiasts/docker-opensky-network:latest
    container_name: opensky
    restart: unless-stopped
    tty: true
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME}
      - OPENSKY_SERIAL=${OPENSKY_SERIAL}

  # ADS-B Exchange
  adsbexchange:
    image: ghcr.io/sdr-enthusiasts/docker-adsbexchange:latest
    container_name: adsbx
    restart: unless-stopped
    pids_limit: 128
    depends_on:
      ultrafeeder:
        condition: service_healthy
    environment:
      - TZ=${FEEDER_TZ}
      - BEASTHOST=ultrafeeder
      - LAT=${FEEDER_LAT}
      - LONG=${FEEDER_LONG}
      - ALT=${FEEDER_ALT_M}
      - SITENAME=${FEEDER_NAME}
      - UUID=${ULTRAFEEDER_UUID}

  # Radar1090 UK: UK/Ireland-focused aggregator (https://www.1090mhz.uk/)
  # Requires a feeder key: email mike@tubby.org (or WhatsApp +44 1905 888020)
  # with a station name (3-9 chars) and antenna lat/lon, then set RADAR1090_KEY
  # in .env. Gated behind the 'radar1090' profile so it does not start until
  # keyed; start with:  docker compose --profile radar1090 up -d radar1090
  # (or remove the profiles line below to include it in the default stack).
  # The image ships its own watchdog-based HEALTHCHECK.
  radar1090:
    image: ghcr.io/sdr-enthusiasts/docker-radar1090:latest
    container_name: radar1090
    hostname: radar1090
    restart: unless-stopped
    pids_limit: 128
    profiles: ["radar1090"]
    depends_on:
      ultrafeeder:
        condition: service_healthy
    environment:
      - TZ=${FEEDER_TZ}
      - RADAR1090_KEY=${RADAR1090_KEY}
      - BEASTHOST=ultrafeeder
      - VERBOSE=false
    tmpfs:
      - /run:exec,size=256M
      - /tmp:size=128M
      - /var/log:size=32M

  # ===========================================================================
  # ENVIRONMENTAL SENSORS
  # ===========================================================================

  # BME680 -> MQTT: temperature, humidity, pressure, dew point, gas resistance,
  # air-quality score. Reads the Bosch BME680 over I2C (bus 1 / GPIO2-3,
  # addr 0x77) in userspace and publishes to MQTT with Home Assistant
  # auto-discovery. See README "BME680 -> MQTT publisher".
  # NOTE: Requires host I2C enabled (dtparam=i2c_arm=on) and sensor on /dev/i2c-1
  bme680:
    build:
      context: ./bme680-mqtt
      dockerfile: Dockerfile
    image: bme680-mqtt:local
    container_name: bme680
    restart: unless-stopped
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - BME680_TOPIC_PREFIX=${BME680_TOPIC_PREFIX:-rfpi/bme680}
      - BME680_INTERVAL=${BME680_INTERVAL:-30}
      - BME680_I2C_ADDR=${BME680_I2C_ADDR:-0x77}
      - BME680_I2C_BUS=${BME680_I2C_BUS:-1}
      - BME680_HA_DISCOVERY=${BME680_HA_DISCOVERY:-true}
    devices:
      - /dev/i2c-1:/dev/i2c-1
    # Local image, no built-in HEALTHCHECK. The publisher writes the epoch time
    # to /tmp/bme680_healthy only after a state message was accepted by a live
    # broker connection, so this goes unhealthy when publishing stalls (the
    # process exits 1 after 10 failed cycles and restart: unless-stopped
    # recovers it).
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/bme680_healthy 2>/dev/null || echo 0) )) -lt 90"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # MONITORING & LOGGING
  # ===========================================================================

  # Promtail: ship container logs to the remote Loki (TLS verified, basic auth).
  # Discovery and log streaming both go through the Docker API over the socket
  # (docker_sd_configs), so no access to /var/lib/docker/containers is needed.
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    environment:
      - LOKI_URL=${LOKI_URL}
      - LOKI_USERNAME=${LOKI_USERNAME}
      - LOKI_PASSWORD=${LOKI_PASSWORD}
      - LOKI_TENANT_ID=${LOKI_TENANT_ID:-}
      - HOSTNAME=rf-pi
    volumes:
      # Read positions persist across restarts so history is not re-shipped.
      # Small and regenerable (worst case: duplicate lines in Loki); no backup.
      - promtail-positions:/var/lib/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    # Image has no built-in HEALTHCHECK; exact process-name match (-x).
    healthcheck:
      test: ["CMD", "pgrep", "-x", "promtail"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # promtail read-position file (see promtail service above).
  promtail-positions:
