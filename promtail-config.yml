server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Persisted on the promtail-positions named volume (docker-compose.yml) so a
  # restart resumes where it left off instead of re-shipping all history.
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push
    basic_auth:
      username: ${LOKI_USERNAME}
      password: ${LOKI_PASSWORD}
    tenant_id: ${LOKI_TENANT_ID:-}
    # TLS is verified against the system CA bundle. The Loki endpoint presents
    # a publicly trusted Let's Encrypt certificate (checked 2026-10-03:
    # `curl` without -k and `openssl s_client` both verify OK), so
    # insecure_skip_verify is not needed; it would only let a MITM capture the
    # basic-auth credentials.

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use container name as label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Add host label
      - source_labels: []
        target_label: host
        replacement: ${HOSTNAME:-rf-pi}
      # Add job label based on compose service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      # Add compose project label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: project
